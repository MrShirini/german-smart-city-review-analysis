[project]
name = "smart-city-review-mining"
version = "0.1.0"
description = "Text mining and sentiment analysis of German municipal app reviews."
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "nltk",
    "wordcloud",
    "seaborn",
    "textblob",
    "notebook>=7.5.6",
    "ipykernel>=7.2.0",
    "google-play-scraper>=1.2.7",
    "transformers>=5.12.1",
    "torch>=2.12.1",
    "accelerate>=1.14.0",
    "tiktoken>=0.13.0",
    "sentencepiece>=0.2.1",
    "protobuf>=7.35.1",
    "tqdm>=4.67.3",
    "bertopic>=0.17.4",
    "sentence-transformers>=5.6.0",
    "umap-learn>=0.5.12",
    "hdbscan>=0.8.44",
]
